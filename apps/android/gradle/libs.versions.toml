# Archie Android — single version catalog (spec 14 §1.4).
#
# Rules
# - This file is the only place versions appear. Modules use aliases only.
# - Three tiers. `catalogTierCheck` (build-logic, ArchieTiers.kt) fails the build when a
#   legacy-tier module (minSdk 21: shared core + :app-lite) declares a MODERN alias, or a
#   modern module (minSdk 26: :core:data/design/markdown, :feature:*, :app-main) declares a
#   *Legacy alias. Tiers are read from the comment headers below ("# ---- <tier> tier"), so a
#   new version must be placed under the right header.
# - Bumping a legacy alias: first check the new AAR's manifest
#   (`unzip -p x.aar AndroidManifest.xml | grep minSdk`) is still <= 21.
# - Later work packages request additions in gradle/catalog-requests.md; A-01's owner or the
#   coordinator merges them between waves.
# - Every version below was verified against Google Maven / Maven Central / the Gradle plugin
#   portal on 2026-10-03 (E-3). See VERSIONS.md.

[versions]
# ---- toolchain (shared) ----
agp = "9.4.1"
kotlin = "2.4.20"
# ---- modern tier (minSdk 26 modules only) ----
composeBom = "2026.09.00"          # material3 1.4.0, adaptive 1.3.0, ui 1.12.1
navigation3 = "1.2.0"
adaptiveNav3 = "1.3.0"
lifecycleNav3 = "2.11.0"           # lifecycle-viewmodel-navigation3
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activity = "1.13.0"
datastore = "1.2.1"
webkit = "1.17.1"
browser = "1.10.0"
splashscreen = "1.2.0"
profileinstaller = "1.4.1"
# ---- legacy tier (minSdk 21 modules + :app-lite); NEVER bump past these ----
coreKtxLegacy = "1.17.0"           # 1.18.0 declares minSdk 23
datastoreLegacy = "1.1.7"          # 1.2.0 declares minSdk 23
recyclerviewLegacy = "1.4.0"       # only if the lite settings list needs it
# ---- pinned tier (voice parity, inv04 §8 risk 5); bump only via decision Q4 ----
okhttp = "4.12.0"
webrtc = "1.1.1"                   # io.getstream:stream-webrtc-android
vosk = "0.3.47"                    # com.alphacephei:vosk-android (pulls JNA 5.13.0)
# ---- shared tier ----
coroutines = "1.11.0"
serialization = "1.11.0"
collectionsImmutable = "0.5.2"
commonmark = "0.30.0"
highlights = "1.1.0"               # dev.snipme:highlights
diffUtils = "4.17"                 # io.github.java-diff-utils
desugar = "2.1.5"
# ---- test tier (shared) ----
junit4 = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
robolectric = "4.17"
roborazzi = "1.76.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
benchmark = "1.5.0"

