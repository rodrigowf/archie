# Archie Android build settings (spec 14 §1.1, §6.5 resource rule: 8 cores / 15 GB laptop).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.caching=true
# The Kotlin daemon is a separate JVM; keep it modest too.
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Emulator work only: -Parchie.emulatorAbis=true adds x86_64 (main) / x86 (lite) (spec 14 §1.6).
archie.emulatorAbis=false
